name: Accessibility screen reader

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/a11y-screen-reader.yml'
      - 'frontend/packages/a11y-testing/**'

permissions:
  contents: read

concurrency:
  group: a11y-screen-reader-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  voiceover-web:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Set up CI
        uses: ./.github/actions/ci-setup
        with:
          matrix-os: macos-14
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Download embedded model
        shell: bash
        run: |
          set -euo pipefail
          model=backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf
          mkdir -p "$(dirname "$model")"
          curl -fSL -o "$model" "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/240a3d36d952677199045d0139efa056b830819c/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          checksum='931036c9173fe126d794191206c5a0f064d4b9c0f7ad82dfba6cc95b458f6d6d'
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$checksum" "$model" | sha256sum -c -
          else
            printf '%s  %s\n' "$checksum" "$model" | shasum -a 256 -c -
          fi
      - name: Build daemon
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            daemon_name=aarch64-apple-darwin
          else
            daemon_name=x86_64-apple-darwin
          fi
          mkdir -p plz-out/bin/backend
          go build -o "plz-out/bin/backend/seed-daemon-${daemon_name}" ./backend/cmd/seed-daemon
        env:
          CGO_ENABLED: 1
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
      - name: Configure VoiceOver
        working-directory: frontend/packages/a11y-testing
        run: |
          pnpm exec guidepup setup --ci
          pnpm exec guidepup install
      - name: Install WebKit
        working-directory: frontend/packages/a11y-testing
        run: pnpm exec playwright install webkit
      - name: Run VoiceOver web suite
        working-directory: frontend/packages/a11y-testing
        run: pnpm test:screen-reader -- --project=voiceover screen-reader/reader.voiceover.spec.ts
      - name: Upload spoken phrases and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voiceover-web-artifacts
          path: frontend/packages/a11y-testing/screen-reader/test-results
          if-no-files-found: warn

  nvda-web:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Set up CI
        uses: ./.github/actions/ci-setup
        with:
          matrix-os: windows-latest
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Download embedded model
        shell: bash
        run: |
          set -euo pipefail
          model=backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf
          mkdir -p "$(dirname "$model")"
          curl -fSL -o "$model" "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/240a3d36d952677199045d0139efa056b830819c/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          printf '%s  %s\n' '931036c9173fe126d794191206c5a0f064d4b9c0f7ad82dfba6cc95b458f6d6d' "$model" | sha256sum -c -
      - name: Build daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plz-out/bin/backend
          go build -o plz-out/bin/backend/seed-daemon-x86_64-pc-windows-gnu.exe ./backend/cmd/seed-daemon
        env:
          CGO_ENABLED: 1
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
      - name: Configure NVDA
        working-directory: frontend/packages/a11y-testing
        run: |
          pnpm exec guidepup setup --ci
          pnpm exec guidepup install
      - name: Install Chromium
        working-directory: frontend/packages/a11y-testing
        run: pnpm exec playwright install chromium
      - name: Run NVDA web suite
        working-directory: frontend/packages/a11y-testing
        run: pnpm test:screen-reader -- --project=nvda screen-reader/reader.nvda.spec.ts
      - name: Upload spoken phrases and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvda-web-artifacts
          path: frontend/packages/a11y-testing/screen-reader/test-results
          if-no-files-found: warn

  voiceover-desktop:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Set up CI
        uses: ./.github/actions/ci-setup
        with:
          matrix-os: macos-14
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Download embedded model
        shell: bash
        run: |
          set -euo pipefail
          model=backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf
          mkdir -p "$(dirname "$model")"
          curl -fSL -o "$model" "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/240a3d36d952677199045d0139efa056b830819c/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          checksum='931036c9173fe126d794191206c5a0f064d4b9c0f7ad82dfba6cc95b458f6d6d'
          if command -v sha256sum >/dev/null 2>&1; then
            printf '%s  %s\n' "$checksum" "$model" | sha256sum -c -
          else
            printf '%s  %s\n' "$checksum" "$model" | shasum -a 256 -c -
          fi
      - name: Build desktop test bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            daemon_name=aarch64-apple-darwin
            arch=arm64
          else
            daemon_name=x86_64-apple-darwin
            arch=x64
          fi
          echo "DAEMON_NAME=${daemon_name}" >> "$GITHUB_ENV"
          mkdir -p plz-out/bin/backend
          go build -o "plz-out/bin/backend/seed-daemon-${daemon_name}" ./backend/cmd/seed-daemon
          (cd agents && bun install --frozen-lockfile && bun scripts/build-binary.ts --target="${daemon_name}" --smoke)
          node scripts/set-desktop-version.mjs
          pnpm desktop:test:package --arch="${arch}"
          test -f frontend/apps/desktop/.vite/build/main.js
        env:
          CGO_ENABLED: 1
          CI: '' # Avoid signing the test bundle; VoiceOver launches Electron with the built main entry.
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
          NODE_ENV: test
          VITE_VERSION: 100.10.1
          VITE_DESKTOP_P2P_PORT: '58000'
          VITE_DESKTOP_HTTP_PORT: '58001'
          VITE_DESKTOP_GRPC_PORT: '58002'
          VITE_DESKTOP_APPDATA: Seed.test
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ github.token }}
      - name: Configure VoiceOver
        working-directory: frontend/packages/a11y-testing
        run: |
          pnpm exec guidepup setup --ci
          pnpm exec guidepup install
      - name: Run packaged-app VoiceOver suite
        working-directory: frontend/packages/a11y-testing
        env:
          A11Y_SCREEN_READER_SURFACE: desktop
        run: pnpm test:screen-reader -- --project=voiceover screen-reader/desktop.voiceover.spec.ts
      - name: Upload spoken phrases and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voiceover-desktop-artifacts
          path: frontend/packages/a11y-testing/screen-reader/test-results
          if-no-files-found: warn

  electron-axe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - name: Set up CI
        uses: ./.github/actions/ci-setup
        with:
          matrix-os: ubuntu-latest
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - name: Download embedded model
        shell: bash
        run: |
          set -euo pipefail
          model=backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf
          mkdir -p "$(dirname "$model")"
          curl -fSL -o "$model" "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/240a3d36d952677199045d0139efa056b830819c/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          printf '%s  %s\n' '931036c9173fe126d794191206c5a0f064d4b9c0f7ad82dfba6cc95b458f6d6d' "$model" | sha256sum -c -
      - name: Build packaged app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plz-out/bin/backend
          go build -o plz-out/bin/backend/seed-daemon-x86_64-unknown-linux-gnu ./backend/cmd/seed-daemon
          (cd agents && bun install --frozen-lockfile && bun scripts/build-binary.ts --target=x86_64-unknown-linux-gnu --smoke)
          node scripts/set-desktop-version.mjs
          pnpm desktop:package --arch=x64
        env:
          CGO_ENABLED: 1
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
          NODE_ENV: test
          VITE_VERSION: 100.0.0
          VITE_DESKTOP_P2P_PORT: '58000'
          VITE_DESKTOP_HTTP_PORT: '58001'
          VITE_DESKTOP_GRPC_PORT: '58002'
          VITE_DESKTOP_APPDATA: Seed.test
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install keyring and display dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring xvfb
      - name: Run Electron axe suite
        shell: bash
        env:
          A11Y_ARTIFACT_DIR: ${{ runner.temp }}/a11y-shell
          A11Y_ELECTRON_SETUID_SANDBOX: '1'
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d "${RUNNER_TEMP}/xdg-runtime.XXXXXX")"
          export XDG_CONFIG_HOME="$(mktemp -d "${RUNNER_TEMP}/xdg-config.XXXXXX")"
          export XDG_DATA_HOME="$(mktemp -d "${RUNNER_TEMP}/xdg-data.XXXXXX")"
          echo "A11Y_XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            password="$(openssl rand -hex 32)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            printf "%s\n" "$password" | gnome-keyring-daemon --unlock
            unset password
            dbus-send --session --type=method_call --print-reply \
              --dest=org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.SetAlias \
              string:default objpath:/org/freedesktop/secrets/collection/session
            pnpm --dir frontend/apps/desktop exec playwright test --project=e2e tests/a11y-shell.e2e.ts
          '
      - name: Upload Electron axe screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-axe-artifacts
          path: |
            ${{ runner.temp }}/a11y-shell
            frontend/apps/desktop/test-results
          if-no-files-found: warn
      - name: Upload Electron app logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-axe-app-logs
          path: ${{ runner.temp }}/xdg-config.*/Seed.test/logs
          if-no-files-found: warn
