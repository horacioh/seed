name: Custom - Agents Images

on:
  workflow_dispatch:
  push:
    branches:
      - custom-images
    paths:
      - apps/**
      - frontend/packages/shared/**
      - frontend/packages/client/**
      - devin-bridge/**
      - .github/workflows/custom-apps-images.yml
    tags:
      - '*.*.*-custom'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APPS_IMAGE: ghcr.io/horacioh/seed-apps
  BRIDGE_IMAGE: ghcr.io/horacioh/seed-devin-bridge

jobs:
  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve Docker image tag
        id: resolve
        shell: bash
        run: |
          # Branch pushes publish the rolling `main` tag; `<version>-custom` tags,
          # created when the fork mirrors an upstream release, publish `<version>`.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME%-custom}"
          else
            tag="main"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved Docker image tag: $tag"

  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: devin-bridge
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: devin-bridge
        run: bunx tsc --noEmit

      - name: Test
        working-directory: devin-bridge
        run: bun test

  docker-apps:
    runs-on: ubuntu-latest
    needs: [image-tag]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit date
        run: |
          COMMIT_DATE=$(git show -s --format="%cd" ${{ github.sha }})
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR Release ${{ env.APPS_IMAGE }}:${{ needs.image-tag.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: apps/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.APPS_IMAGE }}:${{ needs.image-tag.outputs.tag }}
            ${{ env.APPS_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.image-tag.outputs.tag }}
            COMMIT_HASH=${{ github.sha }}
            BRANCH=${{ github.ref }}
            DATE=${{ env.COMMIT_DATE }}
          cache-from: type=gha,scope=docker-apps-custom-ghcr
          cache-to: type=gha,mode=max,scope=docker-apps-custom-ghcr

  docker-devin-bridge:
    runs-on: ubuntu-latest
    needs: [image-tag, bridge-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit date
        run: |
          COMMIT_DATE=$(git show -s --format="%cd" ${{ github.sha }})
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR Release ${{ env.BRIDGE_IMAGE }}:${{ needs.image-tag.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: devin-bridge
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BRIDGE_IMAGE }}:${{ needs.image-tag.outputs.tag }}
            ${{ env.BRIDGE_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.image-tag.outputs.tag }}
            COMMIT_HASH=${{ github.sha }}
            BRANCH=${{ github.ref }}
            DATE=${{ env.COMMIT_DATE }}
          cache-from: type=gha,scope=docker-devin-bridge-custom-ghcr
          cache-to: type=gha,mode=max,scope=docker-devin-bridge-custom-ghcr

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-apps, docker-devin-bridge]
    # Only the rolling `main` tag is redeployed; `<version>-custom` tag builds are not followed.
    if: github.ref == 'refs/heads/custom-images'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Redeploy agents stacks on Coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_SERVICES: ${{ vars.COOLIFY_AGENTS_SERVICES }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: bash .github/scripts/coolify-redeploy.sh
