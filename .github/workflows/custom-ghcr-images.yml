name: Custom - GHCR Images

on:
  workflow_dispatch:
  push:
    branches:
      - custom-images
    tags:
      - '*.*.*-custom'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/horacioh/seed-web
  SITE_IMAGE: ghcr.io/horacioh/seed-site

jobs:
  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve Docker image tag
        id: resolve
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME%-custom}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" != "custom-images" ]]; then
            # Prefix branch dispatch tags so they cannot overwrite production tags.
            branch_tag="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's#[^A-Za-z0-9_.-]+#-#g')"
            tag="branch-${branch_tag:0:121}"
          else
            tag="main"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved Docker image tag: $tag"

  frontend-tests:
    uses: ./.github/workflows/test-frontend-parallel.yml

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache GGUF model
        uses: actions/cache@v4
        with:
          path: backend/llm/backends/llamacpp/models/*.gguf
          key: gguf-model-granite-v2
          enableCrossOsArchive: true

      - name: Download GGUF model
        run: |
          if [ ! -f backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf ]; then
            mkdir -p backend/llm/backends/llamacpp/models
            curl -fSL -o backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf \
              "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/main/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libvulkan-dev glslc

      - name: Compute llama-go submodule sha
        id: llama-sha
        run: echo "sha=$(git -C backend/util/llama-go rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache llama.cpp build (Vulkan)
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: |
            backend/util/llama-go/libbinding.a
            backend/util/llama-go/libllama.a
            backend/util/llama-go/libggml*.a
            backend/util/llama-go/libcommon.a
            backend/util/llama-go/build
          key: llama-vulkan-linux-portable-${{ steps.llama-sha.outputs.sha }}

      - name: Build llama.cpp (with Vulkan GPU support)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          cd backend/util/llama-go
          BUILD_TYPE=vulkan CMAKE_ARGS="-DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF" make libbinding.a

      - name: Run tests
        run: go test --count 1 ./backend/...
        env:
          CGO_ENABLED: 1
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
          LLAMA_LOG: error

      - name: Run tests with race detector
        run: go test --count 1 -race ./backend/...
        env:
          CGO_ENABLED: 1
          LIBRARY_PATH: ${{ github.workspace }}/backend/util/llama-go
          C_INCLUDE_PATH: ${{ github.workspace }}/backend/util/llama-go
          LLAMA_LOG: error

  build-and-perf-test:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Web App
        run: pnpm web:prod

      - name: Run Notify Tests
        run: pnpm --filter @shm/notify test

      - name: Build Notify App
        run: pnpm notify:build

      - name: Start Web Server
        run: |
          pnpm web:start &
          sleep 5 # Wait for server to start

      - name: Run Performance Tests
        run: |
          cd frontend/apps/perf-web
          pnpm start --url http://localhost:3000 --app web

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/build/
          retention-days: 1

  docker-web:
    runs-on: ${{ matrix.runner }}
    needs: [image-tag, build-and-perf-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit date
        run: |
          COMMIT_DATE=$(git show -s --format="%cd" "${{ github.sha }}")
          echo "COMMIT_DATE=$COMMIT_DATE" >> "$GITHUB_ENV"

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.WEB_IMAGE }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PREBUILT=true
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SITE_SENTRY_DSN=${{ secrets.SITE_SENTRY_DSN }}
            COMMIT_HASH=${{ github.sha }}
            BRANCH=${{ github.ref }}
            DATE=${{ env.COMMIT_DATE }}
          cache-from: type=gha,scope=docker-web-custom-ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-web-custom-ghcr-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          touch "/tmp/digests/$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: web-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-site:
    runs-on: ${{ matrix.runner }}
    needs: [image-tag, frontend-tests, backend-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get commit date
        run: |
          COMMIT_DATE=$(git show -s --format="%cd" "${{ github.sha }}")
          echo "COMMIT_DATE=$COMMIT_DATE" >> "$GITHUB_ENV"

      - name: Cache GGUF model
        uses: actions/cache@v4
        with:
          path: backend/llm/backends/llamacpp/models/*.gguf
          key: gguf-model-granite-v2
          enableCrossOsArchive: true

      - name: Download GGUF model
        run: |
          if [ ! -f backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf ]; then
            mkdir -p backend/llm/backends/llamacpp/models
            curl -fSL -o backend/llm/backends/llamacpp/models/granite-embedding-107m-multilingual-Q8_0.gguf \
              "https://huggingface.co/keisuke-miyako/granite-embedding-107m-multilingual-gguf-q8_0/resolve/main/granite-embedding-107m-multilingual-Q8_0.gguf?download=true"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.SITE_IMAGE }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/cmd/seed-daemon/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.SITE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BRANCH=${{ github.ref }}
            DATE=${{ env.COMMIT_DATE }}
          cache-from: type=gha,scope=docker-site-custom-ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-site-custom-ghcr-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          touch "/tmp/digests/$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: site-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-manifest:
    runs-on: ubuntu-latest
    needs: [image-tag, docker-web]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: web-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and inspect manifest list
        env:
          IMAGE: ${{ env.WEB_IMAGE }}
          IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest_file in /tmp/digests/*; do
            digest="${digest_file##*/}"
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"

  docker-site-manifest:
    runs-on: ubuntu-latest
    needs: [image-tag, docker-site]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: site-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and inspect manifest list
        env:
          IMAGE: ${{ env.SITE_IMAGE }}
          IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sources=()
          for digest_file in /tmp/digests/*; do
            digest="${digest_file##*/}"
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
