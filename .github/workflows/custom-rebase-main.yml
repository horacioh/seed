name: Custom - Rebase Main from Upstream

on:
  workflow_dispatch:
  schedule:
    # Keep Horacio's fork close to upstream every 6 hours.
    - cron: '17 */6 * * *'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  rebase-main:
    name: Rebase horacioh/seed:main on upstream/main
    runs-on: ubuntu-latest
    if: github.repository == 'horacioh/seed'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure actions bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Record starting HEAD
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/seed-hypermedia/seed.git
          git fetch --prune upstream main

      - name: Rebase main on upstream/main
        run: git rebase upstream/main

      - name: Record rebased HEAD
        id: after
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push rebased main
        if: steps.after.outputs.sha != steps.before.outputs.sha
        run: git push --force-with-lease origin HEAD:main

      - name: Dispatch custom image workflow
        if: steps.after.outputs.sha != steps.before.outputs.sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run custom-ghcr-images.yml --repo horacioh/seed --ref main

      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Upstream rebase failed'
          body="The scheduled rebase of \`main\` onto \`seed-hypermedia/seed:main\` failed, most likely due to a rebase conflict with the fork's custom commits. Resolve it manually, then re-run the workflow.

          Failed run: $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Rebase failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Branch protection note
        run: |
          echo 'If this workflow cannot push to main, update branch protection to allow this GitHub Actions workflow/bot to bypass or satisfy the rule.'
